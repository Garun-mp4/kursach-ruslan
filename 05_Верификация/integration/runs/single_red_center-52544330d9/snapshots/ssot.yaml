    origin: design_assumption
    basis: Ненулевая конфигурация локтя, отведенная от подающих/приемных зон
    owner: M2
  contact.friction_table_slide:
    value: 0.5
    unit: dimensionless
    origin: design_assumption
    basis: Начальное трение объектов о стол и лотки; M7 sensitivity
    owner: M7
  contact.friction_table_spin:
    value: 0.005
    unit: m
    origin: design_assumption
    basis: Начальный torsional friction модели
    owner: M7
  contact.friction_table_roll:
    value: 0.001
    unit: m
    origin: design_assumption
    basis: Начальный rolling friction модели
    owner: M7
  contact.condim:
    value: 6
    unit: contact dimension
    origin: design_assumption
    basis: MuJoCo контакт включает касательную, spin и rolling составляющие
    owner: M7
  contact.solref:
    value:
    - 0.02
    - 1.0
    unit: time constant [s], damping ratio
    origin: design_assumption
    basis: Начальная near-critically-damped compliant contact response; M7 tune
    owner: M7
  contact.solimp:
    value:
    - 0.95
    - 0.99
    - 0.001
    unit: dimensionless, dimensionless, m
    origin: design_assumption
    basis: Начальная impedance curve; M7 tune
    owner: M7
  contact.restitution_model:
    value: near-inelastic via solver damping; no independent coefficient of restitution
      is exposed as a measured material property
    unit: description
    origin: design_assumption
    basis: MuJoCo soft-contact parameters solref/solimp define response; physical
      restitution is unknown
    owner: M2
  collision.visual_geom_group:
    value: 1
    unit: MuJoCo group
    origin: design_assumption
    basis: Rendered visual geoms, collision disabled
    owner: M2
  collision.collision_geom_group:
    value: 3
    unit: MuJoCo group
    origin: design_assumption
    basis: Invisible collision geoms are separate duplicates of envelope primitives
    owner: M2
  collision.allowed_pairs:
    value:
    - - base_static
      - link1
    - - link1
      - link2
    - - link2
      - z_slide
    - - z_slide
      - wrist
    - - wrist
      - finger_left
    - - wrist
      - finger_right
    unit: body-name pair
    origin: design_assumption
    basis: Only fixed/mechanical neighbors and intended joint overlaps are excluded;
      object-table and object-tray support contacts remain active
    owner: M2
  collision.non_adjacent_robot_collision:
    value: true
    unit: boolean
    origin: design_assumption
    basis: Do not disable all self-collision; non-adjacent robot and scene interactions
      remain active
    owner: M2
  collision.visual_and_collision_separate:
    value: true
    unit: boolean
    origin: design_assumption
    basis: Каждому envelope geom соответствует отдельный collision-disabled visual
      и collision geom
    owner: M2
  planning.static_clearance_m:
    value: 0.005
    unit: m
    origin: design_assumption
    basis: Minimum required static/mechanical clearance at every verified trajectory
      sample; each sample threshold adds the conservative bound on motion since the
      previous sample and the numeric reserve. This is not a continuous collision-free
      proof between samples.
    owner: M5
  planning.max_joints_not_enforced_by_engine:
    value:
    - robot.j1_velocity_rad_s
    - robot.j2_velocity_rad_s
    - robot.j3_velocity_m_s
    - robot.j4_velocity_rad_s
    unit: parameter reference
    origin: design_assumption
    basis: MJCF model stores these limits; trajectory/controller must enforce them
      in M5-M7
    owner: M5
  kinematics.numeric_cos_tolerance:
    value: 1.0e-12
    unit: dimensionless
    origin: design_assumption
    basis: Только погрешность округления для аналитического cos(q2) у границ [-1,1];
      не расширяет геометрическую область достижимости
    owner: M3
  kinematics.joint_limit_tolerance_rad:
    value: 1.0e-12
    unit: rad
    origin: design_assumption
    basis: Допуск round-off при аналитическом представлении revolute-кандидата у границы;
      после принятия значение ограничивается точным физическим пределом
    owner: M3
  kinematics.joint_limit_tolerance_m:
    value: 1.0e-12
    unit: m
    origin: design_assumption
    basis: Допуск round-off при переводе целевого Z в ход J3; цели за этим допуском
      отклоняются, после принятия координата ограничивается точным физическим пределом
    owner: M3
  kinematics.candidate_dedup_tolerance:
    value: 1.0e-12
    unit: dimensionless
    origin: design_assumption
    basis: Удаление повторов IK по максимальной разности суставов, нормированной на
      допустимый диапазон каждого сустава
    owner: M3
  kinematics.position_acceptance_m:
    value: 1.0e-06
    unit: m
    origin: design_assumption
    basis: Численный допуск FK/IK равен 0.001 mm и в 1000 раз меньше выделенного M2
      кинематического бюджета захвата 1 mm; не является допуском компьютерного зрения
    owner: M3
  kinematics.yaw_acceptance_rad:
    value: 1.0e-08
    unit: rad
    origin: design_assumption
    basis: Численный допуск аналитического преобразования yaw существенно меньше M2
      проектного ограничения ориентации захвата 10 градусов
    owner: M3
  kinematics.near_singular_abs_sin_q2:
    value: 0.05
    unit: dimensionless
    origin: design_assumption
    basis: Диагностический порог sin(q2); для звеньев M2 при q2 около 0.05 rad planar
      Jacobian condition number близок к 100; флаг предупреждает, но сам по себе не
      запрещает достижимую позу
    owner: M3
  robot.wrist_hub_center_in_wrist_m:
    value:
    - 0.0
    - 0.0
    - 0.01
    unit: m
    origin: design_assumption
    basis: Raised J4 hub, aligned with palm; provides 8 mm bottom clearance above
      the grasped cuboid at the M2 TCP grasp pose.
    owner: M5
  robot.finger_center_in_wrist_m:
    value:
    - 0.0
    - 0.0
    - -0.006
    unit: m
    origin: design_assumption
    basis: Finger contact pads sit 6 mm above TCP center; an 8 mm cuboid-side overlap
      remains while preserving 8 mm bottom clearance to table/tray floor. Explicit
      after M5 tool-envelope correction.
    owner: M5
  planning.perceived_object_clearance_m:
    value: 0.015
    unit: m
    origin: design_assumption
    basis: 'Conservative required clearance to perception-positioned cuboids: 5.0
      mm static reserve + 2.0 mm allocated XY error + 3.5 mm maximum 10-degree yaw-induced
      corner shift + 0.5 mm tracking allocation + 1.0 mm sample swept-step bound +
      0.25 mm numerical allowance + 2.75 mm residual reserve.'
    owner: M5
  planning.path_sweep_sample_step_m:
    value: 0.001
    unit: m
    origin: design_assumption
    basis: Maximum conservative displacement of any checked collision-geometry point
      between adjacent samples; the configured 1 mm baseline bounds all arm coordinates
      and the carried cuboid. M5 checks route convergence again at a 0.5 mm half-step
      and includes a controlled thin-obstacle midpoint test.
    owner: M5
  planning.distance_numeric_tolerance_m:
    value: 0.00025
    unit: m
    origin: design_assumption
    basis: Conservative numerical-distance reserve used in collision thresholds; verification
      compares MuJoCo distances against a refined sampling run.
    owner: M5
  planning.safe_transfer_tcp_z_m:
    value: 0.06
    unit: m
    origin: design_assumption
    basis: Reuses the M2 safe-transfer TCP height; above input cuboids and tray walls.
    owner: M5
  planning.max_normalized_joint_step:
    value: 0.02
    unit: dimensionless
    origin: design_assumption
    basis: Maximum Euclidean joint displacement per Cartesian waypoint in M3 range-normalized
      coordinates; recursively subdivide larger intervals.
    owner: M5
  planning.branch_singularity_weight:
    value: 0.02
    unit: dimensionless
    origin: design_assumption
    basis: Penalty weight on normalized reciprocal manipulability indicator; compared
      only with dimensionless range-normalized continuity cost.
    owner: M5
  planning.plan_timeout_s:
    value: 90.0
    unit: s
    origin: design_assumption
    basis: Wall-clock cap for a complete pick/place preflight. The M5 half-step convergence
      route required 58.4 s on the validation PC with a 60 s cap; increased to 90
      s to leave runtime headroom while timeout still returns a structured fail-closed
      result. This does not change trajectory or collision acceptance criteria.
    owner: M5
  planning.motion_profile:
    value: quintic_rest_to_rest
    unit: profile
    origin: design_assumption
    basis: Zero endpoint velocity and acceleration on each geometric phase; no dynamic
      actuator guarantee.
    owner: M5
  planning.parameterization_safety_scale:
    value: 1.02
    unit: ratio
    origin: design_assumption
    basis: Adds a 2% temporal reserve after analytical spline derivative bounds so
      sampled joint and gripper velocity/acceleration remain below the configured
      M2 limits; the verification runner checks the complete sampled trajectory explicitly.
    owner: M5
  planning.contact_speed_scale:
    value: 0.15
    unit: ratio
    origin: design_assumption
    basis: Descent/lift/retreat phases use an additional duration scale >= 1/scale;
      quintic endpoints remain zero-velocity.
    owner: M5
  planning.transfer_ring_radial_clearance_m:
    value: 0.01
    unit: m
    origin: design_assumption
    basis: Deterministic transfer route uses a 10 mm outer radial reserve above the
      endpoint radii, clamped to the non-singular reachable annulus. The reserve was
      reduced from 20 mm after a branch-continuity preflight showed the larger ring
      unnecessarily reached a q1 wrap boundary; revised routes must pass full IK and
      collision preflight before use.
    owner: M5
  planning.maximum_waypoint_refinements:
    value: 12
    unit: iteration
    origin: design_assumption
    basis: Bounded bisection count for Cartesian waypoint/branch continuity refinement;
      exhausted refinement returns safe failure.
    owner: M5
  planning.minimum_clearance_report_cap_m:
    value: 0.05
    unit: m
    origin: design_assumption
    basis: Bounded MuJoCo geom-distance query cap. Conservative AABB lower bounds
      decide when narrow-phase distance calls are necessary; avoids relying on large-range
      legacy CCD queries.
    owner: M5
  planning.allowed_gripper_object_contact_phases:
    value:
    - GRASP_CLOSE
    - LIFT
    - TRANSFER
    - PREPLACE
    - PLACE_DESCENT
    - RELEASE
    - RETREAT
    unit: phase
    origin: design_assumption
    basis: Only the selected target's finger contact may occur during grasp, carried
      transfer, placement, and vertical release retreat; palm/wrist contact remains
      checked.
    owner: M5
  planning.self_collision_clearance_m:
    value: 0.0
    unit: m
    origin: design_assumption
    basis: No arbitrary static reserve is imposed between non-adjacent robot bodies;
      the checker still requires path-sweep and numerical-distance margin and rejects
      contact/penetration.
    owner: M5
  planning.maximum_detection_age_s:
    value: 0.04
    unit: s
    origin: source
    basis: M4 sensor interface maximum_age_s; planner rejects stale perception before
      building a route.
    owner: M5
  planning.position_sigma_limit_m:
    value: 0.002
    unit: m
    origin: source
    basis: M4/M2 grasp position uncertainty allocation; an observation exceeding the
      allocated xy budget is not pickable.
    owner: M5
  planning.yaw_sigma_limit_rad:
    value: 0.17453292519943295
    unit: rad
    origin: source
    basis: M2 grasp yaw error limit (10 degrees); exceeds this limit means safe refusal.
    owner: M5
  planning.allowed_support_contact_phases:
    value:
    - INITIAL_APPROACH
    - PREGRASP
    - DESCENT
    - GRASP_CLOSE
    unit: phase
    origin: design_assumption
    basis: Selected object/table support is expected only while object is resting
      in input; payload/tray-floor support is allowed only at RELEASE/RETREAT.
    owner: M5
  planning.grasp_entry_clearance_m:
    value: 0.004
    unit: m
    origin: design_assumption
    basis: Minimum signed clearance from the target cuboid for the open-gripper approach,
      excluding only exact finger-target contacts during GRASP_CLOSE. Derived from
      M2 worst-yaw half-clearance 10.201 mm minus 2.0 mm XY allocation, 2.2 mm projected-span/yaw
      allowance, 0.5 mm tracking, 1.0 mm swept-step, and 0.25 mm distance allowance;
      rounded down to 4 mm.
    owner: M5
  planning.minimum_abs_sin_q2:
    value: 0.05
    unit: dimensionless
    origin: design_assumption
    basis: Hard planning threshold reuses the M3 NEAR_SINGULARITY diagnostic boundary;
      candidate branches below it fail closed.
    owner: M5
  planning.transfer_arc_max_angle_rad:
    value: 0.08726646259971647
    unit: rad
    origin: design_assumption
    basis: Maximum 5-degree deterministic arc waypoint spacing; at the M2 maximum
      0.43 m radius, chord sag is below 0.82 mm.
    owner: M5
  planning.maximum_cartesian_waypoint_step_m:
    value: 0.02
    unit: m
    origin: design_assumption
    basis: Upper bound before adaptive M3-normalized joint-step subdivision; no geometric
      path segment is left longer than 20 mm.
    owner: M5
  planning.replan_target_shift_xy_m:
    value: 0.002
    unit: m
    origin: design_assumption
    basis: Replan/stop if a refreshed supported detection shifts more than the M4
      allocated 2 mm XY perception budget before contact.
    owner: M5
  planning.replan_target_shift_yaw_rad:
    value: 0.17453292519943295
    unit: rad
    origin: design_assumption
    basis: Replan/stop if refreshed target orientation shifts more than the M4 10-degree
      grasp yaw acceptance limit.
    owner: M5
  planning.joint_tracking_error_budget_m:
    value: 0.0005
    unit: m
    origin: design_assumption
    basis: Handoff limit reuses the M7 allocated 0.5 mm tracking contribution in the
      M2 grasp error budget; M7 must implement/validate actuator tracking.
    owner: M5
  controller.observation_timeout_s:
    value: 0.25
    unit: s of simulation time
    origin: design_assumption
    basis: Bounded wait for one new camera/perception result; frame freshness remains
      inherited from M4.
    owner: M6
  controller.init_timeout_s:
    value: 0.5
    unit: s of simulation time
    origin: design_assumption
    basis: Bounded wait for valid startup arm and gripper state before initialization
      fails closed.
    owner: M6
  controller.select_timeout_s:
    value: 0.5
    unit: s of simulation time
    origin: design_assumption
    basis: Bounded high-level ranking/reservation step; no motion is issued from an
      expired selection.
    owner: M6
  controller.plan_response_timeout_s:
    value: 120.0
    unit: s of simulation time
    origin: design_assumption
    basis: Bounded asynchronous wait for M5 PlanResult; M5's compute wall-time cap
      remains separately authoritative.
    owner: M6
  controller.recovery_timeout_s:
    value: 5.0
    unit: s of simulation time
    origin: design_assumption
    basis: Bounded wait for M7's explicitly requested safe recovery result; timeout
      latches SAFE_STOP.
    owner: M6
  controller.place_verification_timeout_s:
    value: 0.5
    unit: s of simulation time
    origin: design_assumption
    basis: Finite wait for a fresh public perception result after release; it does
      not authorize retrying release.
    owner: M6
  controller.hold_verification_timeout_s:
    value: 0.25
    unit: s of simulation time
    origin: design_assumption
    basis: Bounded wait for a fresh hold sensor and post-lift M4 frame after the test
      lift completes.
    owner: M6
  controller.gripper_release_confirmation_timeout_s:
    value: 0.25
    unit: s of simulation time
    origin: design_assumption
    basis: Bounded wait for a fresh gripper signal indicating it no longer holds an
      object after RELEASE.
    owner: M6
  controller.empty_scene_confirm_frames:
    value: 3
    unit: distinct fresh frames
    origin: design_assumption
    basis: A valid empty scene is confirmed over distinct frames to avoid treating
      one missed frame as batch completion.
    owner: M6
  controller.unknown_confirm_frames:
    value: 2
    unit: distinct fresh frames
    origin: design_assumption
    basis: UNKNOWN remains unassigned to any color; after this many separate observations
      it is recorded as skipped.
    owner: M6
  controller.max_camera_failures:
    value: 3
    unit: consecutive failures
    origin: design_assumption
    basis: Consecutive invalid/missing perception responses before SAFE_STOP.
    owner: M6
  controller.max_plan_retries:
    value: 1
    unit: retries per track
    origin: design_assumption
    basis: Retry transient M5 failures once after a new M4 frame; deterministic geometric
      refusal is not retried.
    owner: M6
  controller.max_grasp_attempts:
    value: 2
    unit: total attempts per track
    origin: design_assumption
    basis: One initial attempt plus at most one bounded retry after a public no-hold
      signal and safe recovery.
    owner: M6
  controller.max_cycle_attempts_per_track:
    value: 2
    unit: total attempts per track
    origin: design_assumption
    basis: Bounded full-cycle execution attempts; uncertain payload state always stops
      rather than repeating.
    owner: M6
  controller.execution_timeout_factor:
    value: 1.5
    unit: ratio
    origin: design_assumption
    basis: State budget is max(minimum, summed M5 phase duration times this factor
      plus margin).
    owner: M6
  controller.execution_timeout_margin_s:
    value: 2.0
    unit: s of simulation time
    origin: design_assumption
    basis: Fixed grace margin for state-level execution feedback after its M5 phase
      duration estimate.
    owner: M6
  controller.execution_timeout_min_s:
    value: 1.0
    unit: s of simulation time
    origin: design_assumption
    basis: Lower bound for a motion state even when a phase has near-zero sampled
      duration.
    owner: M6
  controller.cycle_timeout_factor:
    value: 1.5
    unit: ratio
    origin: design_assumption
    basis: Full-cycle budget derived from M5 plan duration with headroom; starts only
      after a complete plan is accepted.
    owner: M6
  controller.cycle_timeout_margin_s:
    value: 30.0
    unit: s of simulation time
    origin: design_assumption
    basis: Fixed full-cycle feedback margin after the M5 predicted motion duration.
    owner: M6
  controller.batch_timeout_s:
    value: 1800.0
    unit: s of simulation time
    origin: design_assumption
    basis: Finite batch watchdog for up to several long M5 cycles; reaching it stops
      the run safely.
    owner: M6
  controller.hold_evidence_max_age_s:
    value: 0.04
    unit: s of simulation time
    origin: inherited
    basis: Reuses M4 sensor_interface.maximum_age_s; stale contact evidence cannot
      confirm a grasp.
    owner: M6
  controller.place_evidence_min_confidence:
    value: 0.75
    unit: normalized confidence
    origin: design_assumption
    basis: Minimum confidence for future M7 public camera evidence of a released class
      and slot; must be checked against M7 perception integration.
    owner: M6
  controller.selection_weight_confidence:
    value: 0.4
    unit: normalized score weight
    origin: design_assumption
    basis: Deterministic SELECT ranking weight for lower classification confidence.
    owner: M6
  controller.selection_weight_xy_uncertainty:
    value: 0.2
    unit: normalized score weight
    origin: design_assumption
    basis: Deterministic SELECT ranking weight for normalized XY uncertainty.
    owner: M6
  controller.selection_weight_yaw_uncertainty:
    value: 0.1
    unit: normalized score weight
    origin: design_assumption
    basis: Deterministic SELECT ranking weight for normalized yaw uncertainty.
    owner: M6
  controller.selection_weight_motion:
    value: 0.25
    unit: normalized score weight
    origin: design_assumption
    basis: Deterministic SELECT ranking weight for estimated XY travel distance; M5
      remains the only feasibility authority.
    owner: M6
  controller.selection_weight_failures:
    value: 0.05
    unit: normalized score weight
    origin: design_assumption
    basis: Deterministic SELECT ranking penalty for earlier safe failures, below quality
      and travel cost.
    owner: M6
  controller.max_recovery_attempts:
    value: 1
    unit: retries per recovery action
    origin: design_assumption
    basis: Recovery is attempted once; a failed or unknown result moves to SAFE_STOP.
    owner: M6
  controller.max_scene_uncertainty_frames:
    value: 3
    unit: distinct fresh frames
    origin: design_assumption
    basis: Incomplete/occluded scene is retried only for a bounded number of fresh
      frames before SAFE_STOP.
    owner: M6
  controller.initial_occupied_slots:
    value: []
    unit: list of public slot IDs
    origin: design_assumption
    basis: Empty default setup for the controlled coursework cell; M7 must supply
      public initial occupancy if a run starts with objects already in trays.
    owner: M6
  controller.gripper_position_tolerance_m:
    value: 0.00025
    unit: m
    origin: inherited
    basis: Reuses planning.distance_numeric_tolerance_m for startup gripper-home verification.
    owner: M6
assemblies:
  link1:
    body_name: link1
    components:
    - name: link1_tube
      shape: open_rect_tube
      size_ref: robot.link1_tube_outer_xyz_m
      wall_ref: robot.link1_tube_wall_m
      center_ref: robot.link1_tube_center_m
      axis: x
    - name: link1_connector
      shape: solid_box
      size_ref: robot.link1_connector_xyz_m
      center_ref: robot.link1_connector_center_m
    - name: elbow_plate
      shape: solid_box
      size_ref: robot.elbow_plate_xyz_m
      center_ref: robot.elbow_plate_center_m
  link2:
    body_name: link2
    components:
    - name: link2_tube
      shape: open_rect_tube
      size_ref: robot.link2_tube_outer_xyz_m
      wall_ref: robot.link2_tube_wall_m
      center_ref: robot.link2_tube_center_m
      axis: x
    - name: link2_connector
      shape: solid_box
      size_ref: robot.link2_connector_xyz_m
      center_ref: robot.link2_connector_center_m
    - name: z_guide
      shape: open_rect_tube
      size_ref: robot.z_guide_outer_xyz_m
      wall_ref: robot.z_guide_wall_m
      center_ref: robot.z_guide_center_m
      axis: z
  z_slide:
    body_name: z_slide
    components:
    - name: z_carriage
      shape: closed_rect_shell
      size_ref: robot.z_carriage_plate_xyz_m
      wall_ref: robot.z_carriage_wall_m
      center_ref: robot.z_carriage_center_m
    - name: z_upper_rod
      shape: open_rect_tube
      size_ref: robot.z_upper_rod_xyz_m
      wall_ref: robot.z_upper_rod_wall_m
      center_ref: robot.z_upper_rod_center_m
      axis: z
    - name: z_lower_rod
      shape: open_rect_tube
      size_ref: robot.z_lower_rod_xyz_m
      wall_ref: robot.z_lower_rod_wall_m
      center_ref: robot.z_lower_rod_center_m
      axis: z
  wrist:
    body_name: wrist
    components:
    - name: wrist_hub
      shape: solid_cylinder_z
      radius_param: robot.wrist_radius_m
      height_param: robot.wrist_height_m
      center_ref: robot.wrist_hub_center_in_wrist_m
    - name: palm
      shape: closed_rect_shell
      size_ref: robot.palm_xyz_m
      wall_ref: robot.palm_wall_m
      center_ref: robot.palm_center_in_wrist_m
  finger_left:
    body_name: finger_left
    components:
    - name: finger_left_geom
      shape: solid_box
      size_ref: robot.finger_xyz_m
      center_ref: robot.zero_xyz_m
  finger_right:
    body_name: finger_right
    components:
    - name: finger_right_geom
      shape: solid_box
      size_ref: robot.finger_xyz_m
      center_ref: robot.zero_xyz_m
perception:
  profile_version: M4-v1.3
  profile_sha256: 55c87dcd96f6146a1214765c0fcab66a1be452fc55467ed2ae3a19046a7e19f2
  runtime_config:
    config_version: M4-v1.3
    sensor_interface:
      frame_format: RGB
      dtype: uint8
      resolution_px:
      - 640
      - 480
      pixel_origin: top-left
      maximum_age_s: 0.04
      camera_config_id: overhead_rgb_M2_validated_v1
    camera:
      position_world_m:
      - 0.0
      - 0.0
      - 1.05
      mujoco_quaternion_wxyz:
      - 1.0
      - 0.0
