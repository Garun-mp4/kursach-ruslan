schema_version: M9-campaign-v1.2
campaign_id: M9-RC-2026-01
campaign_title: Приемочная кампания виртуальной сортировки SCARA
project: SCARA_COLOR_SORTER
scope: MuJoCo software simulation; no physical prototype or physical measurements
protocol_status: preregistered-before-acceptance-runs
runtime:
  python: 3.12.10
  mujoco: 3.14.0
  physics_profile: nominal
  max_simulation_time_s: 900.0
  record_video_during_trials: false
  scenario_seed_controls_scene_and_noise_seed_unless_overridden: true
primary_acceptance:
  baseline_experiment: V03_RANDOM_MIXED
  independent_unit: complete three-object seeded batch
  required_seeds: 30
  minimum_complete_batch_rate: 0.90
  minimum_complete_batches: 27
  wrong_bin_placements_allowed: 0
  forbidden_collision_episodes_allowed: 0
  joint_or_actuator_limit_violations_allowed: 0
  rule: A batch is complete only when every active supported-color object is independently confirmed by the post-run evaluator in a settled slot of its true color and the controller ends in DONE.
secondary_acceptance:
  deterministic_color_cases: all supported colors sort correctly in V01
  six_object_batch: all 6 objects sort correctly in V02
  near_boundary_cases: DONE or a reason-coded safe skip; never a wrong placement, forbidden contact, or limit violation
  safe_refusal_cases: expected status/reason, no false success, no unplanned actuator motion
  perturbation_cases: no wrong-color placement; record correct classification, UNKNOWN abstention, and safe stop separately
  repeatability: identical seed/config produces identical controller/evaluator outcomes and matching deterministic logs within numeric serialization tolerance
  confidence_interval: Wilson 95% interval at the independent run/batch level; do not treat objects within a batch as independent runs
seed_sets:
  mixed_baseline: [20261001, 20261002, 20261003, 20261004, 20261005, 20261006, 20261007, 20261008, 20261009, 20261010, 20261011, 20261012, 20261013, 20261014, 20261015, 20261016, 20261017, 20261018, 20261019, 20261020, 20261021, 20261022, 20261023, 20261024, 20261025, 20261026, 20261027, 20261028, 20261029, 20261030]
  paired_sensor_and_friction: [20261001, 20261002, 20261003, 20261004, 20261005, 20261006, 20261007, 20261008, 20261009, 20261010]
experiments:
  - experiment_id: V03_RANDOM_MIXED
    scenario: m9_random_mixed_three
    scenario_dir: 07_Испытания/scenarios
    seeds: mixed_baseline
    variants:
      - variant_id: nominal
        expected_kind: sort_all
        tags: [V02, V03, V14-control]
        parameters: {}
  - experiment_id: V07_RGB_NOISE
    scenario: m9_random_red_one
    scenario_dir: 07_Испытания/scenarios
    seeds: paired_sensor_and_friction
    variants:
      - variant_id: sigma_0
        expected_kind: sort_all
        tags: [V07-control, V10-friction-control]
        parameters: {rgb_noise_sigma: 0.0}
      - variant_id: sigma_4
        expected_kind: safe_completion
        tags: [V07-noise]
        parameters: {rgb_noise_sigma: 4.0}
      - variant_id: sigma_8
        expected_kind: safe_completion
        tags: [V07-noise]
        parameters: {rgb_noise_sigma: 8.0}
  - experiment_id: V10_GRIP_FRICTION
    scenario: m9_random_red_one
    scenario_dir: 07_Испытания/scenarios
    seeds: paired_sensor_and_friction
    paired_control: {experiment_id: V07_RGB_NOISE, variant_id: sigma_0}
    variants:
      - variant_id: scale_0_001
        expected_kind: contained_fault
        tags: [V10-friction]
        parameters: {gripper_friction_scale: 0.001}
fixed_trials:
  - trial_id: v01_red
    scenario: single_red_center
    expected_kind: sort_all
    tags: [V01]
